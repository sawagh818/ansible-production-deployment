- name: Install Python packages
  apt:
    name:
      - python3
      - python3-pip
    state: present

- name: Install Flask
  pip:
    name: flask

- name: Create app directory
  file:
    path: /opt/app
    state: directory

- name: Deploy Flask app
  copy:
    dest: /opt/app/app.py
    content: |
      from flask import Flask
      app = Flask(__name__)

      @app.route("/")
      def hello():
          return "Hello from Ansible Production App!"

      if __name__ == "__main__":
          app.run(host="0.0.0.0", port=5000)

- name: Run Flask app
  shell: |
    nohup python3 /opt/app/app.py &
