- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Configure Nginx reverse proxy
  copy:
    dest: /etc/nginx/sites-available/default
    content: |
      server {
        listen 80;
        location / {
          proxy_pass http://{{ hostvars[groups['app'][0]].ansible_host }}:5000;
        }
      }
  notify: Restart nginx
